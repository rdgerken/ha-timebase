name: Tests
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: latest
            phcc: pytest-homeassistant-custom-component
          # The declared floor (hacs.json homeassistant: 2025.4.0) — catches
          # recorder-schema/API drift that only breaks on older HA, e.g.
          # metadata keys the old StatisticsMeta model cannot construct.
          - ha: "2025.4 floor"
            phcc: pytest-homeassistant-custom-component==0.13.236
    name: pytest (HA ${{ matrix.ha }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt "${{ matrix.phcc }}"
      - run: pytest tests/ -q
